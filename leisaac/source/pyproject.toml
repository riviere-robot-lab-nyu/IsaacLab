[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leisaac"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "pyzmq>=27.0.0",
    "pydantic==2.10.6",
    "msgpack>=1.0.5",
]

[tool.setuptools]
packages = {find = {}}
zip-safe = false